
---
# Source: harness/templates/all.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: test-migration
  labels:
    app.kubernetes.io/name: migration
    app.kubernetes.io/instance: test
    app.kubernetes.io/managed-by: Helm
  annotations:
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migration
        app.kubernetes.io/instance: test
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: ghcr.io/demo/be:2.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - "/app/migrate"
            - "up"
          envFrom:
            - secretRef:
                name: demo-db

