---
# Source: harness/templates/all.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-mailer
  labels:
    app.kubernetes.io/name: mailer
    app.kubernetes.io/instance: test
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailer
      app.kubernetes.io/instance: test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailer
        app.kubernetes.io/instance: test
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailer
          image: ghcr.io/demo/be:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - "/app/worker"
            - "mailer"
          envFrom:
            - secretRef:
                name: demo-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
