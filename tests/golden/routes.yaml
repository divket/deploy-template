---
# Source: harness/templates/all.yaml
apiVersion: v1
kind: Service
metadata:
  name: test-web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: test
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: test
  ports:
