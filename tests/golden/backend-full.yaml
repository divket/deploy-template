---
# Source: harness/templates/all.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: test
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: test
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: regcred
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/demo/be:2.3.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          command:
            - "/app/server"
            - "--grpc"
          env:
            - name: GRPC_MAX_RECV_MB
              value: "16"
            - name: LOG_LEVEL
              value: "info"
          envFrom:
            - secretRef:
                name: demo-secrets
            - secretRef:
                name: demo-db
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
