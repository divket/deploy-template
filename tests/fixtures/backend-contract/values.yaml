image:
  registry: ghcr.io/demo
  tag: "1.0.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

workloads:
  api:
    kind: backend
    image: be
    tag: "9.9.9"
    replicas: 2
    port: 8080
    command: ["/app/server"]
    args: ["--grpc", "--tls"]
    health:
      port: 8080
      ready: /readyz
      live: /healthz
      startup: /started
    env:
      LOG_LEVEL: info
    envFrom:
      - secretRef: demo-secrets
      - configMapRef: demo-config
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

dependencies:
  - {name: postgres, ns: shared, service: postgres, port: 5432, env: DATABASE_HOST}
  - {name: redis, ns: shared, service: redis, port: 6379, env: REDIS_HOST}
