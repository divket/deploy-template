image:
  registry: ghcr.io/demo
  tag: "2.3.0"
  pullPolicy: Always
  pullSecrets:
    - regcred

workloads:
  api:
    kind: backend
    image: be
    replicas: 2
    port: 8080
    command: ["/app/server", "--grpc"]
    env:
      LOG_LEVEL: info
      GRPC_MAX_RECV_MB: "16"
    envFrom:
      - secretRef: demo-secrets
      - secretRef: demo-db
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    podSecurity:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
      fsGroup: 101
      seccompProfile:
        type: RuntimeDefault
